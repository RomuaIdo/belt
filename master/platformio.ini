; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings shared by every environment below (PlatformIO merges [env] into
; each named [env:xxx] section automatically).
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3 N16R8: 16 MB Flash (Quad-SPI) + 8 MB PSRAM (Octal-SPI/OPI).
; Explicitly uses qio_opi to prevent bootloops caused by bus mode mismatch.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@^7.2.1

board_build.filesystem = littlefs

[env:esp32-s3-devkitc-1]

[env:esp32-s3-devkitc-1-test]
test_build_src = yes
build_src_filter = +<Domain/*> +<Storage/*>
