; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings shared by every environment below (PlatformIO merges [env] into
; each named [env:xxx] section automatically).
[env]
platform = espressif32
board = esp32-s3-devkitc-1   ; generic ESP32-S3 toolchain/bootloader base
framework = arduino

; ESP32-S3FH4R2 ("ESP32-S3 Super Mini"): 4 MB flash + 2 MB PSRAM, both
; embedded in-package via Quad SPI (NOT Octal — only the R8 PSRAM variant,
; used by master's N16R8 chip, needs qio_opi). UNVERIFIED against real
; silicon yet — flash test_board_specs FIRST and read its serial output
; before trusting any other slave code. If boot is garbled/crash-loops,
; the first thing to try is flipping flash_mode between qio/dio.
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 4MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -I../shared/include
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11

lib_deps =
    bblanchon/ArduinoJson@^7.2.1

board_build.filesystem = littlefs

[env:esp32-s3-supermini]

[env:esp32-s3-supermini-test]
test_build_src = yes
build_src_filter = +<Domain/*> +<Storage/*> +<Pairing/*> +<Input/*> +<Sensor/*>
